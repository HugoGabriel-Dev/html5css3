<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>
<body>
    <header>
        <h1>Pesquisa de Dados</h1>
    </header>
    <main>
        <form action="" method="get">

            <fieldset>
                <!-- Dados Pessoais -->
                <legend>Dados Pessoais</legend>
                <label for="userName">Nome:</label>
                <input type="text" name="userName" id="userName" required placeholder="Nome">
                <br>
                <label for="userAge">Idade:</label>
                <input type="number" name="userAge" id="userAge" min="12" max="100" required placeholder="Idade">
                <br>
                <label for="userDate">Data de nascimento:</label>
                <input type="date" name="userDate" id="userDate">
                <br>
                <label for="userEmail">Email:</label>
                <input type="email" name="userEmail" id="userEmail" required placeholder="ex: joao123@gmail.com">
                <br>
                <label for="userTell">Telefone:</label>
                <input type="tel" name="userTell" id="userTell" pattern="[0-9]{11}" placeholder="(99)99999-9999">
                <br>
                <label for="userImage">Upload de Fotos</label>
                <input type="file" accept="image/*" name="userImage" id="userImage">
                <br>
            </fieldset>
            <hr>
            <fieldset>
                <legend>Perfil</legend>
                <!-- Perfil -->
                <p>Gênero:</p>
                <input type="radio" name="userGender" id="userGender" value="Feminino">
                <label for="userGender">Feminino</label>
                <input type="radio" name="userGender" id="userGender" value="Masculino">
                <label for="userGender">Masculino</label>
                <input type="radio" name="userGender" id="userGender" value="prefiro não informar">
                <label for="userGender">Prefiro não informar</label>
                <br>
                <label for="maritalStatus">Estado civil:</label>
                <select name="maritalStatus" id="maritalStatus">
                    <option value="">Selecione...</option>
                    <option value="casado">casado</option>
                    <option value="solteiro">solteiro</option>
                    <option value="união estável">união estável</option>
                    <option value="viuvo">viuvo</option>
                </select>
                <br>
                <label for="userState">Estado:</label>
                <select name="userState" id="userState">
                   <option value="acre"> Acre </option> 
                   <option value="alagoas"> Alagoas </option>
                   <option value="amapá"> Amapá </option>
                   <option value="amazonas"> Amazonas </option>
                   <option value="bahia"> Bahia </option>
                   <option value="ceará"> Ceará </option>
                   <option value="distritoFederal"> Distrito Federal </option>
                   <option value="espiritoSanto"> Espirito Santo </option>
                   <option value="goiás"> Goiás </option>
                   <option value="maranhão"> Maranhão </option>
                   <option value="MGS"> Mato Grosso do Sul </option>
                   <option value="MG"> Mato Grosso </option>
                   <option value="minasGerais"> Minas Gerais </option>
                   <option value="para"> Pará </option>
                   <option value="paraíba"> Paraíba </option>
                   <option value="paraná"> Paraná </option>
                   <option value="pernambuco"> Pernambuco </option>
                   <option value="piauí"> Piauí </option>
                   <option value="RJ"> Rio de Janeiro </option>
                   <option value="rioGrandeDoNorte"> Rio Grande do Norte </option>
                   <option value="rioGrandeDoSul"> Rio Grande do Sul </option>
                   <option value="rondonia"> Rondônia </option>
                   <option value="roraima"> Roraima </option>
                   <option value="santaCatarina"> Santa Catarina </option>
                   <option value="saoPaulo"> São Paulo </option>
                   <option value="sergipe"> Sergipe </option>
                   <option value="tocantins"> Tocantins </option>
                </select>
                <br>
                <label for="userCity">Cidade:</label>
                <input type="text" name="userCity" id="userCity" placeholder="Sua Cidade">
            </fieldset>
            <hr>
            <fieldset>
                <legend>Hábitos</legend>
                <p>Redes sociais</p>
                <input type="checkbox" name="userInstagram" id="instagram">
                <label for="instagram">Instagram</label>
                <input type="checkbox" name="userFacebook" id="facebook">
                <label for="facebook">Facebook</label>
                <input type="checkbox" name="userLinkedin" id="Linkedin">
                <label for="Linkedin">Linkedin</label>
                <input type="checkbox" name="userx" id="x">
                <label for="x">x</label>
            </fieldset>
            <button type="submit">Enviar</button>
        </form>
    </main>
</body>
</html>
