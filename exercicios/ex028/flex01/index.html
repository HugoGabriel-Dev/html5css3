<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div.container{
            display: flex;
            background-color: lightcoral;
            flex-direction:row;
            border: 1px solid black;
        }
        div.itens{
            flex: auto;
            background-color: lightblue;
            text-align: center;
            width: 100px;
            padding: 10px;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <!-- obs: main-axis/cross-axis -->
     <!-- flex-direction -- faz com que seja possivel o ajuste de direção do container -->
    <!-- flex-wrap -- ajusta na hora que o container for quebrado pelo ajuste de tela na direçã odo cross-axis -->
    <div class="container">
        <div class="itens">a</div>
        <div class="itens">b</div>
        <div class="itens">c</div>
        <div class="itens">d</div>
        <div class="itens">e</div>
        <div class="itens">f</div>
        <div class="itens">g</div>
    </div>
</body>
</html>
