<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex boxing</title>
    <style>
        .pai{
            background-color: lightcoral;
            display: flex;
            text-align: center;
        }
        .div{
            background-color: lightblue;
            border: 1px solid black;
            flex-basis: 300px;
        }
        #a{
            flex-grow: 0;
            flex-shrink: 0;

        }
    </style>
</head>
<body>
    <main class="pai">
        <div class="div" id="a">1</div>
        <div class="div">2</div>
        <div class="div">3</div>
    </main>
</body>
</html>
